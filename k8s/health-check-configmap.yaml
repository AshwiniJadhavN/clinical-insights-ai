apiVersion: v1
kind: ConfigMap
metadata:
  name: clinical-insights-ai-health-checks
data:
  liveness-path: /health
  readiness-path: /health
  metrics-path: /metrics
  example-probes.yaml: |
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 30
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 10
